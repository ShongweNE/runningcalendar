<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SA Race Calendar{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
    background: #f7f7f8;
    color: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17181a; color: #e8e8ea; }
    .panel { background: #232427 !important; border-color: #34363a !important; }
    select, input, textarea { background: #17181a; color: #e8e8ea; border-color: #34363a; }
    a { color: #7ab7ff; }
    nav { border-bottom-color: #34363a !important; }
  }
  header {
    padding: 1rem 1.25rem;
    font-weight: 700;
    font-size: 1.25rem;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.25rem;
    padding: 0 1.25rem 0.85rem;
    border-bottom: 1px solid #e3e3e6;
    margin-bottom: 0.5rem;
    font-size: 0.92rem;
  }
  nav a { text-decoration: none; color: inherit; opacity: 0.75; }
  nav a:hover, nav a.active { opacity: 1; text-decoration: underline; }
  nav .spacer { flex: 1; }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 0 1rem 2rem;
  }
  .panel {
    background: white;
    border: 1px solid #e3e3e6;
    border-radius: 10px;
    padding: 1rem;
  }
  label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; font-weight: 600; color: #666; }
  select, input[type=text], input[type=email], input[type=password], input[type=date], textarea {
    width: 100%; padding: 0.4rem; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 1rem;
    font-family: inherit; font-size: 0.95rem; box-sizing: border-box;
  }
  button, .btn {
    padding: 0.45rem 0.9rem; border-radius: 6px; border: 1px solid #ccc;
    background: #f0f0f1; cursor: pointer; font-size: 0.9rem;
  }
  button:hover, .btn:hover { background: #e4e4e6; }
  .error { color: #c0392b; font-size: 0.9rem; margin-bottom: 0.75rem; }
  {% block extra_style %}{% endblock %}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>🏃 South Africa Race Calendar</header>
<nav>
  <a href="/" class="{{ 'active' if active_tab == 'races' else '' }}">Races</a>
  <a href="/werun/clubs" class="{{ 'active' if active_tab == 'clubs' else '' }}">Clubs</a>
  <a href="/werun/first-marathon" class="{{ 'active' if active_tab == 'first-marathon' else '' }}">My First Marathon</a>
  <span class="spacer"></span>
  {% if current_user %}
    <a href="/werun/profile" class="{{ 'active' if active_tab == 'profile' else '' }}">{{ current_user.display_name }}</a>
    <form method="post" action="/werun/logout" style="display:inline; margin:0;">
      <button type="submit">Log out</button>
    </form>
  {% else %}
    <a href="/werun/login">Log in</a>
    <a href="/werun/signup">Sign up</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
