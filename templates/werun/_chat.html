{# Included by club_detail.html and pairing_chat.html. Expects: room_id, current_user #}
<style>
  .chat-panel { margin-top: 1.25rem; }
  #chat-messages { max-height: 360px; overflow-y: auto; margin-bottom: 0.85rem; padding-right: 0.25rem; }
  .chat-row { display: flex; gap: 0.6rem; margin-bottom: 0.85rem; align-items: flex-end; }
  .chat-row.mine { flex-direction: row-reverse; }
  .bubble-wrap { max-width: 72%; }
  .chat-row.mine .bubble-wrap { text-align: right; }
  .bubble-name { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.2rem; }
  .bubble {
    display: inline-block; padding: 0.55rem 0.8rem; border-radius: 14px;
    font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; text-align: left;
    background: var(--bg); border: 1px solid var(--border);
  }
  .chat-row.mine .bubble {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: white; border-color: transparent;
  }
  .bubble-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem; }
  #chat-form { display: flex; gap: 0.5rem; margin: 0; }
  #chat-input { margin-bottom: 0 !important; flex: 1; }
</style>
<div class="panel chat-panel">
  <h3 style="margin-top:0;">💬 Chat</h3>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Message..." maxlength="2000" autocomplete="off">
    <button type="submit" class="btn-primary">Send</button>
  </form>
  <div id="chat-error" class="error" style="display:none;margin-top:0.5rem;margin-bottom:0;"></div>
</div>
<script>
(function () {
  const roomId = {{ room_id }};
  const myUserId = {{ current_user.id }};
  const messagesEl = document.getElementById('chat-messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const errorEl = document.getElementById('chat-error');
  let sinceId = 0;
  let pollTimer = null;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function avatarClass(userId) {
    return 'avatar-' + (userId % 7);
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function renderMessages(messages) {
    for (const m of messages) {
      const mine = m.user_id === myUserId;
      const row = document.createElement('div');
      row.className = 'chat-row' + (mine ? ' mine' : '');

      const avatar = document.createElement('div');
      avatar.className = 'avatar ' + avatarClass(m.user_id);
      avatar.textContent = m.display_name.charAt(0).toUpperCase();

      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      wrap.innerHTML = `
        <div class="bubble-name">${mine ? 'You' : escapeHtml(m.display_name)}</div>
        <div class="bubble">${escapeHtml(m.body)}</div>
        <div class="bubble-time">${formatTime(m.created_at)}</div>
      `;

      row.appendChild(avatar);
      row.appendChild(wrap);
      messagesEl.appendChild(row);
      sinceId = Math.max(sinceId, m.id);
    }
    if (messages.length) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function poll() {
    fetch(`/werun/api/rooms/${roomId}/messages?since_id=${sinceId}`)
      .then(r => { if (!r.ok) throw new Error('poll failed'); return r.json(); })
      .then(renderMessages)
      .catch(() => {});
  }

  function schedulePoll() {
    if (pollTimer) clearTimeout(pollTimer);
    const interval = document.hidden ? 20000 : 4000;
    pollTimer = setTimeout(() => { poll(); schedulePoll(); }, interval);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;
    errorEl.style.display = 'none';
    fetch(`/werun/api/rooms/${roomId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'body=' + encodeURIComponent(body),
    }).then(r => {
      if (!r.ok) throw new Error('send failed');
      input.value = '';
      poll();
    }).catch(() => {
      errorEl.textContent = 'Could not send message. Please try again.';
      errorEl.style.display = 'block';
    });
  });

  document.addEventListener('visibilitychange', schedulePoll);

  poll();
  schedulePoll();
})();
</script>
